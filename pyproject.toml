[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gridpulse-ai"
version = "0.1.0"
description = "Multimodal infrastructure-incident triage MVP"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "GridPulse Contributors" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]
ai = [
  "langgraph>=0.2,<2",
  "google-genai>=1,<2",
  "sentence-transformers>=3,<6",
]
app = [
  "streamlit>=1.40,<2",
]
audio = [
  "openai-whisper>=20231117",
]
vision = [
  "transformers>=4.45,<5",
  "pillow>=10,<12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gridpulse"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
